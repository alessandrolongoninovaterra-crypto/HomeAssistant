<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="700" fill="url(#bg)"/>

  <!-- ============ PRIMO PIANO (allineato sopra soggiorno/cucina, NON sopra il garage) ============ -->
  <text x="40" y="32" font-family="Verdana, sans-serif" font-size="19" font-weight="bold" fill="#3A4650">Primo Piano</text>

  <!-- Balcone superiore -->
  <rect x="40" y="40" width="580" height="26" rx="4" fill="#DCE7EE" stroke="#B9CBD6" stroke-width="2"/>

  <!-- Camera Matrimoniale -->
  <rect x="40" y="72" width="290" height="150" rx="8" fill="#FFF3DE" stroke="#E8CC9A" stroke-width="3"/>
  <text x="185" y="212" font-family="Verdana, sans-serif" font-size="15" fill="#5B5147" text-anchor="middle">Matrimoniale</text>
  <rect x="70" y="100" width="110" height="65" rx="6" fill="#F5E1C0" stroke="#DDB877" stroke-width="2"/>

  <!-- Seconda camera (Rodolfo) -->
  <rect x="340" y="72" width="280" height="150" rx="8" fill="#E6F4EA" stroke="#B9DCC3" stroke-width="3"/>
  <text x="480" y="212" font-family="Verdana, sans-serif" font-size="15" fill="#5B5147" text-anchor="middle">Rodolfo</text>
  <rect x="450" y="100" width="90" height="65" rx="6" fill="#D3ECDA" stroke="#9FCFAE" stroke-width="2"/>

  <!-- Disimpegno / Bagno / Studio -->
  <rect x="40" y="222" width="580" height="50" fill="#F0EEE9" stroke="#DAD5CA" stroke-width="2"/>
  <text x="95" y="252" font-family="Verdana, sans-serif" font-size="11" fill="#8A8172" text-anchor="middle">Dis.</text>
  <rect x="250" y="222" width="90" height="50" fill="#DCEEF7" stroke="#AACFE0" stroke-width="2"/>
  <text x="295" y="251" font-family="Verdana, sans-serif" font-size="11" fill="#5B5147" text-anchor="middle">Bagno</text>
  <rect x="350" y="222" width="90" height="50" fill="#EEE3F5" stroke="#CBB3DE" stroke-width="2"/>
  <text x="395" y="251" font-family="Verdana, sans-serif" font-size="11" fill="#5B5147" text-anchor="middle">Studio</text>

  <!-- Balcone inferiore -->
  <rect x="40" y="272" width="580" height="26" rx="4" fill="#DCE7EE" stroke="#B9CBD6" stroke-width="2"/>

  <!-- Divider -->
  <line x1="20" y1="325" x2="880" y2="325" stroke="#D8D2C4" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- ============ PIANO TERRA ============ -->
  <text x="40" y="358" font-family="Verdana, sans-serif" font-size="19" font-weight="bold" fill="#3A4650">Piano Terra</text>

  <!-- Open space Soggiorno + Pranzo + Cucina -->
  <rect x="40" y="365" width="580" height="210" rx="8" fill="#FDF8F1" stroke="#D8CFC0" stroke-width="3"/>
  <line x1="233" y1="365" x2="233" y2="575" stroke="#E9E1D2" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="426" y1="365" x2="426" y2="575" stroke="#E9E1D2" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="136" y="556" font-family="Verdana, sans-serif" font-size="14" fill="#5B5147" text-anchor="middle">Soggiorno</text>
  <text x="330" y="556" font-family="Verdana, sans-serif" font-size="14" fill="#5B5147" text-anchor="middle">Pranzo</text>
  <text x="523" y="556" font-family="Verdana, sans-serif" font-size="14" fill="#5B5147" text-anchor="middle">Cucina</text>

  <rect x="65" y="405" width="120" height="70" rx="10" fill="#F1E7D8" stroke="#DCC9A8" stroke-width="2"/>
  <rect x="285" y="400" width="60" height="50" fill="#E7DBC5" stroke="#CDB88F" stroke-width="2"/>
  <rect x="450" y="400" width="130" height="40" rx="4" fill="#E4EEF2" stroke="#B9D2DB" stroke-width="2"/>

  <!-- Disimpegno/Bagno di passaggio verso garage -->
  <rect x="620" y="365" width="40" height="100" fill="#F0EEE9" stroke="#DAD5CA" stroke-width="2"/>
  <rect x="620" y="465" width="40" height="110" fill="#F0EEE9" stroke="#DAD5CA" stroke-width="2"/>

  <!-- Garage (arretrato e più in basso, come nella planimetria reale) -->
  <rect x="660" y="400" width="200" height="175" rx="8" fill="#E7E7E7" stroke="#C7C7C7" stroke-width="3"/>
  <text x="760" y="495" font-family="Verdana, sans-serif" font-size="14" fill="#5B5147" text-anchor="middle">Garage</text>
  <ellipse cx="760" cy="470" rx="55" ry="26" fill="#CFCFCF" stroke="#B0B0B0" stroke-width="2"/>

  <!-- Giardino: avvolge la casa a sud, con vialetto ciottolato a est -->
  <rect x="40" y="600" width="820" height="80" fill="#9AE07A"/>
  <rect x="40" y="600" width="820" height="8" fill="#7BCB5C"/>
  <rect x="760" y="575" width="100" height="105" fill="#DCD3BF" stroke="#C4B89C" stroke-width="2"/>
  <circle cx="90" cy="635" r="14" fill="#5CB85C"/>
  <circle cx="700" cy="635" r="14" fill="#5CB85C"/>
  <text x="400" y="655" font-family="Verdana, sans-serif" font-size="13" fill="#3F6B33" text-anchor="middle">Giardino</text>
  <text x="810" y="655" font-family="Verdana, sans-serif" font-size="11" fill="#7A6D50" text-anchor="middle">Vialetto</text>

  <!-- Cancello -->
  <rect x="845" y="655" width="16" height="26" fill="#8A8070"/>

  <!-- Camera mounts Blink -->
  <g>
    <rect x="66" y="600" width="8" height="22" fill="#9A9A9A"/>
    <rect x="55" y="588" width="30" height="16" rx="4" fill="#5B5B5B"/>
  </g>
  <g>
    <rect x="826" y="600" width="8" height="22" fill="#9A9A9A"/>
    <rect x="815" y="588" width="30" height="16" rx="4" fill="#5B5B5B"/>
  </g>
</svg>
