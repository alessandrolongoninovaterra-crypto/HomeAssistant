<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="800" height="660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="660" fill="url(#bg)"/>

  <!-- ============ PRIMO PIANO ============ -->
  <text x="40" y="55" font-family="Verdana, sans-serif" font-size="20" font-weight="bold" fill="#3A4650">Primo Piano</text>

  <!-- Balconi -->
  <rect x="40" y="70" width="300" height="24" rx="4" fill="#DCE7EE" stroke="#B9CBD6" stroke-width="2"/>
  <rect x="460" y="70" width="300" height="24" rx="4" fill="#DCE7EE" stroke="#B9CBD6" stroke-width="2"/>

  <!-- Camera Matrimoniale -->
  <rect x="40" y="100" width="300" height="200" rx="8" fill="#FFF3DE" stroke="#E8CC9A" stroke-width="3"/>
  <text x="190" y="290" font-family="Verdana, sans-serif" font-size="16" fill="#5B5147" text-anchor="middle">Matrimoniale</text>
  <rect x="80" y="150" width="90" height="60" rx="6" fill="#F5E1C0" stroke="#DDB877" stroke-width="2"/>

  <!-- Camera Rodolfo -->
  <rect x="460" y="100" width="300" height="200" rx="8" fill="#E6F4EA" stroke="#B9DCC3" stroke-width="3"/>
  <text x="610" y="290" font-family="Verdana, sans-serif" font-size="16" fill="#5B5147" text-anchor="middle">Rodolfo</text>
  <rect x="580" y="150" width="90" height="60" rx="6" fill="#D3ECDA" stroke="#9FCFAE" stroke-width="2"/>

  <!-- Corridoio / Bagno / Studio centrali -->
  <rect x="340" y="100" width="120" height="110" fill="#F0EEE9" stroke="#DAD5CA" stroke-width="2"/>
  <text x="400" y="160" font-family="Verdana, sans-serif" font-size="12" fill="#8A8172" text-anchor="middle">Dis.</text>

  <rect x="340" y="210" width="60" height="90" fill="#DCEEF7" stroke="#AACFE0" stroke-width="2"/>
  <text x="370" y="260" font-family="Verdana, sans-serif" font-size="12" fill="#5B5147" text-anchor="middle">Bagno</text>

  <rect x="400" y="210" width="60" height="90" fill="#EEE3F5" stroke="#CBB3DE" stroke-width="2"/>
  <text x="430" y="260" font-family="Verdana, sans-serif" font-size="12" fill="#5B5147" text-anchor="middle">Studio</text>

  <!-- Divider -->
  <line x1="20" y1="325" x2="780" y2="325" stroke="#D8D2C4" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- ============ PIANO TERRA ============ -->
  <text x="40" y="355" font-family="Verdana, sans-serif" font-size="20" font-weight="bold" fill="#3A4650">Piano Terra</text>

  <!-- Open space Soggiorno + Pranzo + Cucina -->
  <rect x="40" y="360" width="520" height="200" rx="8" fill="#FDF8F1" stroke="#D8CFC0" stroke-width="3"/>
  <line x1="260" y1="360" x2="260" y2="560" stroke="#E9E1D2" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="380" y1="360" x2="380" y2="560" stroke="#E9E1D2" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="150" y="540" font-family="Verdana, sans-serif" font-size="15" fill="#5B5147" text-anchor="middle">Soggiorno</text>
  <text x="320" y="540" font-family="Verdana, sans-serif" font-size="15" fill="#5B5147" text-anchor="middle">Pranzo</text>
  <text x="470" y="540" font-family="Verdana, sans-serif" font-size="15" fill="#5B5147" text-anchor="middle">Cucina</text>

  <rect x="80" y="400" width="120" height="70" rx="10" fill="#F1E7D8" stroke="#DCC9A8" stroke-width="2"/>
  <rect x="290" y="400" width="60" height="50" fill="#E7DBC5" stroke="#CDB88F" stroke-width="2"/>
  <rect x="410" y="400" width="120" height="40" rx="4" fill="#E4EEF2" stroke="#B9D2DB" stroke-width="2"/>

  <!-- Garage -->
  <rect x="580" y="360" width="180" height="140" rx="8" fill="#E7E7E7" stroke="#C7C7C7" stroke-width="3"/>
  <text x="670" y="440" font-family="Verdana, sans-serif" font-size="15" fill="#5B5147" text-anchor="middle">Garage</text>

  <!-- Giardino -->
  <rect x="0" y="600" width="800" height="60" fill="#9AE07A"/>
  <rect x="0" y="600" width="800" height="8" fill="#7BCB5C"/>
  <circle cx="150" cy="632" r="14" fill="#5CB85C"/>
  <circle cx="650" cy="632" r="14" fill="#5CB85C"/>
  <text x="400" y="650" font-family="Verdana, sans-serif" font-size="13" fill="#3F6B33" text-anchor="middle">Giardino</text>

  <!-- Camera mounts -->
  <g>
    <rect x="55" y="600" width="8" height="22" fill="#9A9A9A"/>
    <rect x="44" y="588" width="30" height="16" rx="4" fill="#5B5B5B"/>
  </g>
  <g>
    <rect x="735" y="600" width="8" height="22" fill="#9A9A9A"/>
    <rect x="724" y="588" width="30" height="16" rx="4" fill="#5B5B5B"/>
  </g>
</svg>
