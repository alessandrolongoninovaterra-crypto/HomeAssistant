<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDEBFF"/>
      <stop offset="100%" stop-color="#F2FAFF"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="700" cy="70" r="34" fill="#FFD166"/>

  <!-- Grass -->
  <rect x="0" y="410" width="800" height="90" fill="#9AE07A"/>
  <rect x="0" y="410" width="800" height="10" fill="#7BCB5C"/>

  <!-- Path to door -->
  <rect x="378" y="415" width="44" height="85" fill="#E9DFC8"/>

  <!-- Trees -->
  <g>
    <rect x="72" y="360" width="14" height="55" rx="4" fill="#B08968"/>
    <circle cx="79" cy="345" r="38" fill="#5CB85C"/>
  </g>
  <g>
    <rect x="710" y="368" width="14" height="47" rx="4" fill="#B08968"/>
    <circle cx="717" cy="352" r="32" fill="#5CB85C"/>
  </g>

  <!-- Bushes near house -->
  <circle cx="185" cy="415" r="20" fill="#6FC46A"/>
  <circle cx="615" cy="415" r="20" fill="#6FC46A"/>

  <!-- House body -->
  <rect x="150" y="150" width="500" height="265" rx="10" fill="#FDF8F1" stroke="#D8CFC0" stroke-width="3"/>

  <!-- Floor divider -->
  <line x1="150" y1="280" x2="650" y2="280" stroke="#E4DCCB" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Roof -->
  <polygon points="130,152 400,55 670,152" fill="#FF9F68" stroke="#E88650" stroke-width="3" stroke-linejoin="round"/>
  <rect x="530" y="80" width="26" height="55" fill="#D9895A"/>

  <!-- Door -->
  <rect x="372" y="330" width="56" height="80" rx="6" fill="#B98155"/>
  <circle cx="416" cy="372" r="3.5" fill="#3A2A1A"/>

  <!-- Ground floor windows -->
  <g>
    <rect x="215" y="300" width="70" height="55" rx="8" fill="#BFE7FA" stroke="#7FB8D6" stroke-width="3"/>
    <text x="250" y="382" font-family="Verdana, sans-serif" font-size="16" fill="#5B5147" text-anchor="middle">Cucina</text>
  </g>
  <g>
    <rect x="365" y="300" width="70" height="55" rx="8" fill="#BFE7FA" stroke="#7FB8D6" stroke-width="3" opacity="0"/>
  </g>
  <g>
    <rect x="515" y="300" width="70" height="55" rx="8" fill="#BFE7FA" stroke="#7FB8D6" stroke-width="3"/>
    <text x="550" y="382" font-family="Verdana, sans-serif" font-size="16" fill="#5B5147" text-anchor="middle">Pranzo</text>
  </g>

  <!-- Ground floor: Salotto window spans area near door left side, label placed at door column -->
  <text x="316" y="382" font-family="Verdana, sans-serif" font-size="16" fill="#5B5147" text-anchor="middle">Salotto</text>

  <!-- First floor windows -->
  <g>
    <rect x="215" y="175" width="70" height="55" rx="8" fill="#FFE3B3" stroke="#E8C07E" stroke-width="3"/>
    <text x="250" y="248" font-family="Verdana, sans-serif" font-size="16" fill="#5B5147" text-anchor="middle">Matrimoniale</text>
  </g>
  <g>
    <rect x="365" y="175" width="70" height="55" rx="8" fill="#FFE3B3" stroke="#E8C07E" stroke-width="3"/>
    <text x="400" y="248" font-family="Verdana, sans-serif" font-size="16" fill="#5B5147" text-anchor="middle">Rodolfo</text>
  </g>
  <g>
    <rect x="515" y="175" width="70" height="55" rx="8" fill="#FFE3B3" stroke="#E8C07E" stroke-width="3"/>
    <text x="550" y="248" font-family="Verdana, sans-serif" font-size="16" fill="#5B5147" text-anchor="middle">Studio</text>
  </g>

  <!-- Floor labels -->
  <text x="170" y="140" font-family="Verdana, sans-serif" font-size="14" fill="#8A8172" text-anchor="start">Primo Piano</text>
  <text x="170" y="298" font-family="Verdana, sans-serif" font-size="14" fill="#8A8172" text-anchor="start">Piano Terra</text>

  <!-- Camera mounts in garden -->
  <g>
    <rect x="66" y="255" width="8" height="40" fill="#9A9A9A"/>
    <rect x="55" y="240" width="30" height="18" rx="4" fill="#5B5B5B"/>
  </g>
  <g>
    <rect x="726" y="255" width="8" height="40" fill="#9A9A9A"/>
    <rect x="715" y="240" width="30" height="18" rx="4" fill="#5B5B5B"/>
  </g>

  <text x="400" y="490" font-family="Verdana, sans-serif" font-size="14" fill="#5B7A4A" text-anchor="middle">Giardino</text>
</svg>
