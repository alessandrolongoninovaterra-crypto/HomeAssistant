# Aggiungi questo blocco al TUO configuration.yaml (sul Raspberry Pi), in fondo
# al file. Crea 9 sensori: 3 fasce orarie (Mattina ~09:00, Pranzo ~13:00,
# Sera ~20:00) per ciascuno dei prossimi 3 giorni (Oggi, Domani, Dopodomani).
#
# IMPORTANTE: se e quando installi MeteoAM, sostituisci "weather.forecast_casa"
# con la nuova entità in TUTTI i punti sotto (sono 18 occorrenze: state e
# attributes di ciascuno dei 9 sensori).

template:
  - trigger:
      - trigger: time_pattern
        minutes: "/30"
      - trigger: homeassistant
        event: start
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_casa
        data:
          type: hourly
        response_variable: meteo_forecast
    sensor:
      # ---------------- OGGI ----------------
      - name: "Meteo Oggi Mattina"
        unique_id: meteo_oggi_mattina
        unit_of_measurement: "°C"
        state: >
          {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
          {% set target = now().replace(hour=9, minute=0, second=0, microsecond=0) %}
          {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
          {{ best.temperature if best else 'unknown' }}
        attributes:
          condition: >
            {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
            {% set target = now().replace(hour=9, minute=0, second=0, microsecond=0) %}
            {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
            {{ best.condition if best else 'unknown' }}

      - name: "Meteo Oggi Pranzo"
        unique_id: meteo_oggi_pranzo
        unit_of_measurement: "°C"
        state: >
          {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
          {% set target = now().replace(hour=13, minute=0, second=0, microsecond=0) %}
          {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
          {{ best.temperature if best else 'unknown' }}
        attributes:
          condition: >
            {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
            {% set target = now().replace(hour=13, minute=0, second=0, microsecond=0) %}
            {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
            {{ best.condition if best else 'unknown' }}

      - name: "Meteo Oggi Sera"
        unique_id: meteo_oggi_sera
        unit_of_measurement: "°C"
        state: >
          {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
          {% set target = now().replace(hour=20, minute=0, second=0, microsecond=0) %}
          {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
          {{ best.temperature if best else 'unknown' }}
        attributes:
          condition: >
            {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
            {% set target = now().replace(hour=20, minute=0, second=0, microsecond=0) %}
            {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
            {{ best.condition if best else 'unknown' }}

      # ---------------- DOMANI ----------------
      - name: "Meteo Domani Mattina"
        unique_id: meteo_domani_mattina
        unit_of_measurement: "°C"
        state: >
          {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
          {% set target = (now() + timedelta(days=1)).replace(hour=9, minute=0, second=0, microsecond=0) %}
          {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
          {{ best.temperature if best else 'unknown' }}
        attributes:
          condition: >
            {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
            {% set target = (now() + timedelta(days=1)).replace(hour=9, minute=0, second=0, microsecond=0) %}
            {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
            {{ best.condition if best else 'unknown' }}

      - name: "Meteo Domani Pranzo"
        unique_id: meteo_domani_pranzo
        unit_of_measurement: "°C"
        state: >
          {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
          {% set target = (now() + timedelta(days=1)).replace(hour=13, minute=0, second=0, microsecond=0) %}
          {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
          {{ best.temperature if best else 'unknown' }}
        attributes:
          condition: >
            {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
            {% set target = (now() + timedelta(days=1)).replace(hour=13, minute=0, second=0, microsecond=0) %}
            {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
            {{ best.condition if best else 'unknown' }}

      - name: "Meteo Domani Sera"
        unique_id: meteo_domani_sera
        unit_of_measurement: "°C"
        state: >
          {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
          {% set target = (now() + timedelta(days=1)).replace(hour=20, minute=0, second=0, microsecond=0) %}
          {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
          {{ best.temperature if best else 'unknown' }}
        attributes:
          condition: >
            {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
            {% set target = (now() + timedelta(days=1)).replace(hour=20, minute=0, second=0, microsecond=0) %}
            {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
            {{ best.condition if best else 'unknown' }}

      # ---------------- DOPODOMANI ----------------
      - name: "Meteo Dopodomani Mattina"
        unique_id: meteo_dopodomani_mattina
        unit_of_measurement: "°C"
        state: >
          {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
          {% set target = (now() + timedelta(days=2)).replace(hour=9, minute=0, second=0, microsecond=0) %}
          {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
          {{ best.temperature if best else 'unknown' }}
        attributes:
          condition: >
            {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
            {% set target = (now() + timedelta(days=2)).replace(hour=9, minute=0, second=0, microsecond=0) %}
            {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
            {{ best.condition if best else 'unknown' }}

      - name: "Meteo Dopodomani Pranzo"
        unique_id: meteo_dopodomani_pranzo
        unit_of_measurement: "°C"
        state: >
          {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
          {% set target = (now() + timedelta(days=2)).replace(hour=13, minute=0, second=0, microsecond=0) %}
          {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
          {{ best.temperature if best else 'unknown' }}
        attributes:
          condition: >
            {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
            {% set target = (now() + timedelta(days=2)).replace(hour=13, minute=0, second=0, microsecond=0) %}
            {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
            {{ best.condition if best else 'unknown' }}

      - name: "Meteo Dopodomani Sera"
        unique_id: meteo_dopodomani_sera
        unit_of_measurement: "°C"
        state: >
          {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
          {% set target = (now() + timedelta(days=2)).replace(hour=20, minute=0, second=0, microsecond=0) %}
          {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
          {{ best.temperature if best else 'unknown' }}
        attributes:
          condition: >
            {% set items = meteo_forecast['weather.forecast_casa']['forecast'] %}
            {% set target = (now() + timedelta(days=2)).replace(hour=20, minute=0, second=0, microsecond=0) %}
            {% set best = items | selectattr('datetime', 'ge', target.isoformat()) | list | first %}
            {{ best.condition if best else 'unknown' }}
