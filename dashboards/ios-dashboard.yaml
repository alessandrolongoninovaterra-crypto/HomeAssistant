title: Casa
views:
  - title: Home
    path: home
    icon: mdi:home
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('weather.forecast_casa') }}"
                secondary: Meteo
                icon: mdi:weather-partly-cloudy
                icon_color: blue
                layout: horizontal
                tap_action:
                  action: more-info
                  entity: weather.forecast_casa
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; }

              - type: custom:mushroom-template-card
                primary: Spegni Tutto
                icon: mdi:power
                icon_color: red
                layout: horizontal
                tap_action:
                  action: call-service
                  service: switch.turn_off
                  target:
                    entity_id:
                      - switch.salotto_sonoff_10027311cf_1
                      - switch.wifi_smart_switch_switch_1
                      - switch.cucina_sonoff_100272ffd8_1
                      - switch.sala_sonoff_100285929a_1
                      - switch.sala_sonoff_100285929a_2
                      - switch.wifi_smart_switch_switch_2
                      - switch.camere_sonoff_100285a1db_1
                      - switch.camere_sonoff_100285a1db_2
                      - switch.rodolfo_sonoff_1002732647_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_2
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; }

          - type: horizontal-stack
            cards:
              # --------------------------------------------------------
              # COLONNA ESTERNO
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Esterno

                  - type: custom:mushroom-template-card
                    primary: Telecamere
                    secondary: rilevamento movimento
                    icon: mdi:cctv
                    icon_color: green
                    layout: horizontal
                    tap_action:
                      action: call-service
                      service: switch.toggle
                      target:
                        entity_id:
                          - switch.esterno_rilevamento_del_movimento_della_telecamera
                          - switch.finestrone_rilevamento_del_movimento_della_telecamera
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.esterno_rilevamento_del_movimento_della_telecamera
                    name: Blink Esterno
                    icon: mdi:cctv
                    icon_color: green
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.blink_esterno_temperatura') }}°C"
                    secondary: "Wi-Fi {{ states('sensor.blink_esterno_potenza_del_segnale_wi_fi') }}%"
                    icon: mdi:thermometer
                    icon_color: blue
                    layout: horizontal
                    tap_action:
                      action: more-info
                      entity: sensor.blink_esterno_temperatura
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
                    name: Blink Finestrone
                    icon: mdi:cctv
                    icon_color: green
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.blink_finestrone_temperatura') }}°C"
                    secondary: "Wi-Fi {{ states('sensor.blink_finestrone_potenza_del_segnale_wi_fi') }}%"
                    icon: mdi:thermometer
                    icon_color: blue
                    layout: horizontal
                    tap_action:
                      action: more-info
                      entity: sensor.blink_finestrone_temperatura
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

              # --------------------------------------------------------
              # COLONNA PIANO TERRA
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Piano Terra

                  - type: custom:mushroom-entity-card
                    entity: switch.cucina_sonoff_100272ffd8_1
                    name: Cucina
                    icon: mdi:silverware-fork-knife
                    icon_color: orange
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.salotto_sonoff_10027311cf_1
                    name: Salotto
                    icon: mdi:sofa
                    icon_color: amber
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.sala_sonoff_100285929a_2
                    name: Pranzo
                    icon: mdi:silverware
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.wifi_smart_switch_switch_2
                    name: Pranzo (2)
                    icon: mdi:silverware-variant
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.sala_sonoff_100285929a_1
                    name: Presa
                    icon: mdi:power-socket-eu
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.wifi_smart_switch_switch_1
                    name: Presa Salotto
                    icon: mdi:power-socket-eu
                    icon_color: amber
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

              # --------------------------------------------------------
              # COLONNA PRIMO PIANO
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Primo Piano

                  - type: custom:mushroom-entity-card
                    entity: switch.camere_sonoff_100285a1db_1
                    name: Matrimoniale
                    icon: mdi:bed-king
                    icon_color: indigo
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.matrimoniale_matrimoniale_studio_interruttore_1
                    name: Matrimoniale (2)
                    icon: mdi:bed
                    icon_color: indigo
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.camere_sonoff_100285a1db_2
                    name: Armadio
                    icon: mdi:wardrobe
                    icon_color: indigo
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.rodolfo_sonoff_1002732647_1
                    name: Rodolfo
                    icon: mdi:lightbulb
                    icon_color: purple
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.matrimoniale_matrimoniale_studio_interruttore_2
                    name: Studio
                    icon: mdi:desk
                    icon_color: cyan
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }
