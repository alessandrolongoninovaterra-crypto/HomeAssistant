title: Casa
views:
  - title: Home
    path: home
    icon: mdi:view-dashboard
    type: panel
    background: linear-gradient(135deg, #2B1A52 0%, #4B2F86 45%, #5F3FAE 100%)
    cards:
      - type: vertical-stack
        cards:
          # ---------------- BARRA SUPERIORE (compatta, 1 riga) ----------------
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ now().strftime('%H:%M') }}"
                secondary: "{{ now().strftime('%a %d %b') }}"
                icon: mdi:clock-outline
                layout: horizontal
                card_mod: &clockcard
                  style: |
                    ha-card {
                      background: rgba(255,255,255,0.10);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border: 1px solid rgba(255,255,255,0.16);
                      border-top-color: rgba(255,255,255,0.3);
                      border-radius: 20px;
                      box-shadow: 0 10px 28px -14px rgba(0,0,0,.5);
                      color: white;
                      --primary-text-color: white;
                      --secondary-text-color: rgba(255,255,255,.6);
                      --icon-color: rgba(255,255,255,.85);
                    }
                    ha-card .primary { font-size: 22px !important; font-weight: 700 !important; letter-spacing: -.02em; }
                    ha-card .secondary { text-transform: uppercase; letter-spacing: .04em; font-size: 10.5px !important; }

              - type: custom:mushroom-template-card
                primary: Spegni Tutto
                icon: mdi:power
                layout: horizontal
                tap_action:
                  action: call-service
                  service: switch.turn_off
                  target:
                    entity_id:
                      - switch.salotto_sonoff_10027311cf_1
                      - switch.wifi_smart_switch_switch_1
                      - switch.cucina_sonoff_100272ffd8_1
                      - switch.sala_sonoff_100285929a_1
                      - switch.sala_sonoff_100285929a_2
                      - switch.wifi_smart_switch_switch_2
                      - switch.camere_sonoff_100285a1db_1
                      - switch.camere_sonoff_100285a1db_2
                      - switch.rodolfo_sonoff_1002732647_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_2
                card_mod: &pillred
                  style: |
                    ha-card {
                      background: rgba(255,90,80,.22);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border: 1px solid rgba(255,255,255,.16);
                      border-radius: 999px;
                      box-shadow: 0 10px 28px -14px rgba(0,0,0,.5);
                      color: white;
                      --icon-color: #FF7A70;
                    }
                    ha-card .primary { font-weight: 600 !important; font-size: 13px !important; }

              - type: custom:mushroom-template-card
                primary: Telecamere
                icon: mdi:cctv
                layout: horizontal
                tap_action:
                  action: call-service
                  service: switch.toggle
                  target:
                    entity_id:
                      - switch.esterno_rilevamento_del_movimento_della_telecamera
                      - switch.finestrone_rilevamento_del_movimento_della_telecamera
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(90,170,255,.20);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border: 1px solid rgba(255,255,255,.16);
                      border-radius: 999px;
                      box-shadow: 0 10px 28px -14px rgba(0,0,0,.5);
                      color: white;
                      --icon-color: #6FB4FF;
                    }
                    ha-card .primary { font-weight: 600 !important; font-size: 13px !important; }

          # ---------------- METEO: tabella compatta (giorni in orizzontale, fasce in verticale) ----------------
          - type: markdown
            content: >-
              {% set icons = {'clear-night':'mdi:weather-night','cloudy':'mdi:weather-cloudy','fog':'mdi:weather-fog','hail':'mdi:weather-hail','lightning':'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy','partlycloudy':'mdi:weather-partly-cloudy','pouring':'mdi:weather-pouring','rainy':'mdi:weather-rainy','snowy':'mdi:weather-snowy','snowy-rainy':'mdi:weather-snowy-rainy','sunny':'mdi:weather-sunny','windy':'mdi:weather-windy','windy-variant':'mdi:weather-windy-variant','exceptional':'mdi:alert'} %}

              {%- macro cell(sensor) -%}
              <ha-icon icon="{{ icons.get(state_attr(sensor,'condition'), 'mdi:weather-partly-cloudy') }}"></ha-icon> {{ states(sensor) }}°
              {%- endmacro %}


              | | Oggi | Domani | Dopodom. |

              |---|:---:|:---:|:---:|

              | Mattina | {{ cell('sensor.meteo_oggi_mattina') }} | {{ cell('sensor.meteo_domani_mattina') }} | {{ cell('sensor.meteo_dopodomani_mattina') }} |

              | Pranzo | {{ cell('sensor.meteo_oggi_pranzo') }} | {{ cell('sensor.meteo_domani_pranzo') }} | {{ cell('sensor.meteo_dopodomani_pranzo') }} |

              | Sera | {{ cell('sensor.meteo_oggi_sera') }} | {{ cell('sensor.meteo_domani_sera') }} | {{ cell('sensor.meteo_dopodomani_sera') }} |
            card_mod: &glass
              style: |
                ha-card {
                  background: rgba(255,255,255,0.10);
                  backdrop-filter: blur(20px);
                  -webkit-backdrop-filter: blur(20px);
                  border: 1px solid rgba(255,255,255,0.16);
                  border-top-color: rgba(255,255,255,0.3);
                  border-radius: 20px;
                  box-shadow: 0 10px 28px -14px rgba(0,0,0,.5);
                  color: white;
                  --primary-text-color: white;
                  --secondary-text-color: rgba(255,255,255,.6);
                  --icon-color: rgba(255,255,255,.85);
                }
                ha-card table { width: auto; max-width: 340px; margin: 4px auto; border-collapse: collapse; color: white; font-size: 12px; }
                ha-card th, ha-card td { padding: 3px 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.10); }
                ha-card th { color: rgba(255,255,255,.5); font-weight: 700; font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; padding-bottom: 6px; }
                ha-card th:first-child, ha-card td:first-child { text-align: left; color: rgba(255,255,255,.6); font-weight: 600; font-size: 11px; }
                ha-card tr:last-child td { border-bottom: none; }
                ha-card ha-icon { color: rgba(255,255,255,.85); --mdc-icon-size: 15px; vertical-align: middle; }

          # ---------------- 3 COLONNE: Piano Terra / Primo Piano / Giardino+Sistema ----------------
          - type: horizontal-stack
            cards:
              # Gruppo compatto: le 3 colonne di interruttori insieme contano come
              # UNA sola card nello stack esterno, cosi' restano piu' strette e
              # lasciano spazio al calendario accanto.
              - type: horizontal-stack
                cards:
                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-title-card
                        title: Piano Terra
                        card_mod:
                          style: |
                            ha-card .primary { color: rgba(255,255,255,.55) !important; font-weight: 700 !important; font-size: 11px !important; text-transform: uppercase; letter-spacing: .06em; }

                      - type: custom:mushroom-entity-card
                        entity: switch.salotto_sonoff_10027311cf_1
                        name: Salotto
                        icon: mdi:sofa
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.wifi_smart_switch_switch_1
                        name: Presa Salotto
                        icon: mdi:power-socket-eu
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.sala_sonoff_100285929a_2
                        name: Pranzo
                        icon: mdi:silverware
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.wifi_smart_switch_switch_2
                        name: Pranzo 2
                        icon: mdi:silverware-variant
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.sala_sonoff_100285929a_1
                        name: Presa
                        icon: mdi:power-socket-eu
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.cucina_sonoff_100272ffd8_1
                        name: Cucina
                        icon: mdi:silverware-fork-knife
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass

                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-title-card
                        title: Primo Piano
                        card_mod:
                          style: |
                            ha-card .primary { color: rgba(255,255,255,.55) !important; font-weight: 700 !important; font-size: 11px !important; text-transform: uppercase; letter-spacing: .06em; }

                      - type: custom:mushroom-entity-card
                        entity: switch.camere_sonoff_100285a1db_1
                        name: Matrimoniale
                        icon: mdi:bed-king
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.matrimoniale_matrimoniale_studio_interruttore_1
                        name: Matrimoniale 2
                        icon: mdi:bed
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.camere_sonoff_100285a1db_2
                        name: Armadio
                        icon: mdi:wardrobe
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.rodolfo_sonoff_1002732647_1
                        name: Rodolfo
                        icon: mdi:lightbulb
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.matrimoniale_matrimoniale_studio_interruttore_2
                        name: Studio
                        icon: mdi:desk
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass

                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-title-card
                        title: Giardino
                        card_mod:
                          style: |
                            ha-card .primary { color: rgba(255,255,255,.55) !important; font-weight: 700 !important; font-size: 11px !important; text-transform: uppercase; letter-spacing: .06em; }

                      - type: custom:mushroom-entity-card
                        entity: switch.esterno_rilevamento_del_movimento_della_telecamera
                        name: Blink Esterno
                        icon: mdi:cctv
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: horizontal-stack
                        cards:
                          - type: custom:mushroom-template-card
                            primary: "{{ states('sensor.blink_esterno_temperatura') }}°C"
                            icon: mdi:thermometer
                            layout: horizontal
                            tap_action:
                              action: more-info
                              entity: sensor.blink_esterno_temperatura
                            card_mod: *glass
                          - type: custom:mushroom-template-card
                            primary: "{{ states('sensor.blink_esterno_potenza_del_segnale_wi_fi') }}%"
                            icon: mdi:wifi
                            layout: horizontal
                            tap_action:
                              action: more-info
                              entity: sensor.blink_esterno_potenza_del_segnale_wi_fi
                            card_mod: *glass

                      - type: custom:mushroom-entity-card
                        entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
                        name: Blink Finestrone
                        icon: mdi:cctv
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: horizontal-stack
                        cards:
                          - type: custom:mushroom-template-card
                            primary: "{{ states('sensor.blink_finestrone_temperatura') }}°C"
                            icon: mdi:thermometer
                            layout: horizontal
                            tap_action:
                              action: more-info
                              entity: sensor.blink_finestrone_temperatura
                            card_mod: *glass
                          - type: custom:mushroom-template-card
                            primary: "{{ states('sensor.blink_finestrone_potenza_del_segnale_wi_fi') }}%"
                            icon: mdi:wifi
                            layout: horizontal
                            tap_action:
                              action: more-info
                              entity: sensor.blink_finestrone_potenza_del_segnale_wi_fi
                            card_mod: *glass

                      - type: markdown
                        content: >
                          **Sistema**: aggiungi l'integrazione *System Monitor* per vedere qui
                          CPU/RAM/temperatura del Raspberry Pi.
                        card_mod:
                          style: |
                            ha-card {
                              background: rgba(255,255,255,0.06);
                              border: 1px solid rgba(255,255,255,0.12);
                              border-radius: 18px;
                              color: rgba(255,255,255,.65);
                              font-size: 11px;
                              padding: 10px 12px;
                            }

              # Calendario di famiglia (richiede l'integrazione "Local Calendar",
              # vedi README per l'installazione) — conta come 1 sola card nello
              # stack esterno, quindi occupa quanto le 3 colonne messe insieme.
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Calendario Famiglia
                    card_mod:
                      style: |
                        ha-card .primary { color: rgba(255,255,255,.55) !important; font-weight: 700 !important; font-size: 11px !important; text-transform: uppercase; letter-spacing: .06em; }

                  - type: calendar
                    entities:
                      - calendar.famiglia
                    initial_view: dayGridMonth
                    card_mod: *glass

  - title: Lista
    path: lista
    icon: mdi:format-list-bulleted
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('weather.forecast_casa') }}"
                secondary: Meteo
                icon: mdi:weather-partly-cloudy
                icon_color: blue
                layout: horizontal
                tap_action:
                  action: more-info
                  entity: weather.forecast_casa
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; }

              - type: custom:mushroom-template-card
                primary: Spegni Tutto
                icon: mdi:power
                icon_color: red
                layout: horizontal
                tap_action:
                  action: call-service
                  service: switch.turn_off
                  target:
                    entity_id:
                      - switch.salotto_sonoff_10027311cf_1
                      - switch.wifi_smart_switch_switch_1
                      - switch.cucina_sonoff_100272ffd8_1
                      - switch.sala_sonoff_100285929a_1
                      - switch.sala_sonoff_100285929a_2
                      - switch.wifi_smart_switch_switch_2
                      - switch.camere_sonoff_100285a1db_1
                      - switch.camere_sonoff_100285a1db_2
                      - switch.rodolfo_sonoff_1002732647_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_2
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; }

          - type: horizontal-stack
            cards:
              # --------------------------------------------------------
              # COLONNA ESTERNO
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Esterno

                  - type: custom:mushroom-template-card
                    primary: Telecamere
                    secondary: rilevamento movimento
                    icon: mdi:cctv
                    icon_color: green
                    layout: horizontal
                    tap_action:
                      action: call-service
                      service: switch.toggle
                      target:
                        entity_id:
                          - switch.esterno_rilevamento_del_movimento_della_telecamera
                          - switch.finestrone_rilevamento_del_movimento_della_telecamera
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.esterno_rilevamento_del_movimento_della_telecamera
                    name: Blink Esterno
                    icon: mdi:cctv
                    icon_color: green
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.blink_esterno_temperatura') }}°C"
                    secondary: "Wi-Fi {{ states('sensor.blink_esterno_potenza_del_segnale_wi_fi') }}%"
                    icon: mdi:thermometer
                    icon_color: blue
                    layout: horizontal
                    tap_action:
                      action: more-info
                      entity: sensor.blink_esterno_temperatura
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
                    name: Blink Finestrone
                    icon: mdi:cctv
                    icon_color: green
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.blink_finestrone_temperatura') }}°C"
                    secondary: "Wi-Fi {{ states('sensor.blink_finestrone_potenza_del_segnale_wi_fi') }}%"
                    icon: mdi:thermometer
                    icon_color: blue
                    layout: horizontal
                    tap_action:
                      action: more-info
                      entity: sensor.blink_finestrone_temperatura
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

              # --------------------------------------------------------
              # COLONNA PIANO TERRA
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Piano Terra

                  - type: custom:mushroom-entity-card
                    entity: switch.cucina_sonoff_100272ffd8_1
                    name: Cucina
                    icon: mdi:silverware-fork-knife
                    icon_color: orange
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.salotto_sonoff_10027311cf_1
                    name: Salotto
                    icon: mdi:sofa
                    icon_color: amber
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.sala_sonoff_100285929a_2
                    name: Pranzo
                    icon: mdi:silverware
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.wifi_smart_switch_switch_2
                    name: Pranzo (2)
                    icon: mdi:silverware-variant
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.sala_sonoff_100285929a_1
                    name: Presa
                    icon: mdi:power-socket-eu
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.wifi_smart_switch_switch_1
                    name: Presa Salotto
                    icon: mdi:power-socket-eu
                    icon_color: amber
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

              # --------------------------------------------------------
              # COLONNA PRIMO PIANO
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Primo Piano

                  - type: custom:mushroom-entity-card
                    entity: switch.camere_sonoff_100285a1db_1
                    name: Matrimoniale
                    icon: mdi:bed-king
                    icon_color: indigo
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.matrimoniale_matrimoniale_studio_interruttore_1
                    name: Matrimoniale (2)
                    icon: mdi:bed
                    icon_color: indigo
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.camere_sonoff_100285a1db_2
                    name: Armadio
                    icon: mdi:wardrobe
                    icon_color: indigo
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.rodolfo_sonoff_1002732647_1
                    name: Rodolfo
                    icon: mdi:lightbulb
                    icon_color: purple
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.matrimoniale_matrimoniale_studio_interruttore_2
                    name: Studio
                    icon: mdi:desk
                    icon_color: cyan
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }
