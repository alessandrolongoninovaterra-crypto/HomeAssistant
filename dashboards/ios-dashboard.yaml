title: Casa
views:
  - title: Home
    path: home
    icon: mdi:view-dashboard
    type: panel
    background: linear-gradient(135deg, #2B1A52 0%, #4B2F86 45%, #5F3FAE 100%)
    cards:
      - type: vertical-stack
        cards:
          # ---------------- BARRA SUPERIORE (compatta, 1 riga) ----------------
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ now().strftime('%H:%M') }}"
                secondary: "{{ now().strftime('%a %d %b') }}"
                icon: mdi:clock-outline
                layout: horizontal
                card_mod: &clockcard
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, #3B5CFF 0%, #6C4CF0 100%);
                      border-radius: 16px;
                      color: white;
                      --primary-text-color: white;
                      --secondary-text-color: rgba(255,255,255,.85);
                      --icon-color: white;
                    }

              - type: custom:mushroom-template-card
                primary: >-
                  {{ (state_attr('weather.forecast_casa','forecast') or [{}])[0].get('temperature', state_attr('weather.forecast_casa','temperature')) }}°C
                secondary: Oggi
                icon: >-
                  {% set icons = {'clear-night':'mdi:weather-night','cloudy':'mdi:weather-cloudy','fog':'mdi:weather-fog','hail':'mdi:weather-hail','lightning':'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy','partlycloudy':'mdi:weather-partly-cloudy','pouring':'mdi:weather-pouring','rainy':'mdi:weather-rainy','snowy':'mdi:weather-snowy','snowy-rainy':'mdi:weather-snowy-rainy','sunny':'mdi:weather-sunny','windy':'mdi:weather-windy','windy-variant':'mdi:weather-windy-variant','exceptional':'mdi:alert'} %}
                  {{ icons.get((state_attr('weather.forecast_casa','forecast') or [{}])[0].get('condition', states('weather.forecast_casa')), 'mdi:weather-partly-cloudy') }}
                layout: horizontal
                tap_action:
                  action: more-info
                  entity: weather.forecast_casa
                card_mod: &glass
                  style: |
                    ha-card {
                      background: rgba(255,255,255,0.08);
                      backdrop-filter: blur(16px);
                      -webkit-backdrop-filter: blur(16px);
                      border: 1px solid rgba(255,255,255,0.14);
                      border-radius: 16px;
                      color: white;
                      --primary-text-color: white;
                      --secondary-text-color: rgba(255,255,255,.75);
                      --icon-color: white;
                    }

              - type: custom:mushroom-template-card
                primary: >-
                  {{ (state_attr('weather.forecast_casa','forecast') or [{}, {}])[1].get('temperature', '—') }}°C
                secondary: Domani
                icon: >-
                  {% set icons = {'clear-night':'mdi:weather-night','cloudy':'mdi:weather-cloudy','fog':'mdi:weather-fog','hail':'mdi:weather-hail','lightning':'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy','partlycloudy':'mdi:weather-partly-cloudy','pouring':'mdi:weather-pouring','rainy':'mdi:weather-rainy','snowy':'mdi:weather-snowy','snowy-rainy':'mdi:weather-snowy-rainy','sunny':'mdi:weather-sunny','windy':'mdi:weather-windy','windy-variant':'mdi:weather-windy-variant','exceptional':'mdi:alert'} %}
                  {{ icons.get((state_attr('weather.forecast_casa','forecast') or [{}, {}])[1].get('condition'), 'mdi:weather-partly-cloudy') }}
                layout: horizontal
                tap_action:
                  action: more-info
                  entity: weather.forecast_casa
                card_mod: *glass

              - type: custom:mushroom-template-card
                primary: >-
                  {{ (state_attr('weather.forecast_casa','forecast') or [{}, {}, {}])[2].get('temperature', '—') }}°C
                secondary: Dopodomani
                icon: >-
                  {% set icons = {'clear-night':'mdi:weather-night','cloudy':'mdi:weather-cloudy','fog':'mdi:weather-fog','hail':'mdi:weather-hail','lightning':'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy','partlycloudy':'mdi:weather-partly-cloudy','pouring':'mdi:weather-pouring','rainy':'mdi:weather-rainy','snowy':'mdi:weather-snowy','snowy-rainy':'mdi:weather-snowy-rainy','sunny':'mdi:weather-sunny','windy':'mdi:weather-windy','windy-variant':'mdi:weather-windy-variant','exceptional':'mdi:alert'} %}
                  {{ icons.get((state_attr('weather.forecast_casa','forecast') or [{}, {}, {}])[2].get('condition'), 'mdi:weather-partly-cloudy') }}
                layout: horizontal
                tap_action:
                  action: more-info
                  entity: weather.forecast_casa
                card_mod: *glass

              - type: custom:mushroom-template-card
                primary: Spegni Tutto
                icon: mdi:power
                layout: horizontal
                tap_action:
                  action: call-service
                  service: switch.turn_off
                  target:
                    entity_id:
                      - switch.salotto_sonoff_10027311cf_1
                      - switch.wifi_smart_switch_switch_1
                      - switch.cucina_sonoff_100272ffd8_1
                      - switch.sala_sonoff_100285929a_1
                      - switch.sala_sonoff_100285929a_2
                      - switch.wifi_smart_switch_switch_2
                      - switch.camere_sonoff_100285a1db_1
                      - switch.camere_sonoff_100285a1db_2
                      - switch.rodolfo_sonoff_1002732647_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_2
                card_mod:
                  style: |
                    ha-card { background: rgba(197,71,58,.35); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; color: white; --icon-color: white; }

              - type: custom:mushroom-template-card
                primary: Telecamere
                icon: mdi:cctv
                layout: horizontal
                tap_action:
                  action: call-service
                  service: switch.toggle
                  target:
                    entity_id:
                      - switch.esterno_rilevamento_del_movimento_della_telecamera
                      - switch.finestrone_rilevamento_del_movimento_della_telecamera
                card_mod:
                  style: |
                    ha-card { background: rgba(58,124,165,.35); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; color: white; --icon-color: white; }

          # ---------------- 3 COLONNE: Piano Terra / Primo Piano / Giardino+Sistema ----------------
          - type: horizontal-stack
            cards:
              # Gruppo compatto: le 3 colonne di interruttori insieme contano come
              # UNA sola card nello stack esterno, cosi' restano piu' strette e
              # lasciano spazio al calendario accanto.
              - type: horizontal-stack
                cards:
                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-title-card
                        title: Piano Terra
                        card_mod:
                          style: |
                            ha-card .primary { color: white; }

                      - type: custom:mushroom-entity-card
                        entity: switch.salotto_sonoff_10027311cf_1
                        name: Salotto
                        icon: mdi:sofa
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.wifi_smart_switch_switch_1
                        name: Presa Salotto
                        icon: mdi:power-socket-eu
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.sala_sonoff_100285929a_2
                        name: Pranzo
                        icon: mdi:silverware
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.wifi_smart_switch_switch_2
                        name: Pranzo 2
                        icon: mdi:silverware-variant
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.sala_sonoff_100285929a_1
                        name: Presa
                        icon: mdi:power-socket-eu
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.cucina_sonoff_100272ffd8_1
                        name: Cucina
                        icon: mdi:silverware-fork-knife
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass

                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-title-card
                        title: Primo Piano
                        card_mod:
                          style: |
                            ha-card .primary { color: white; }

                      - type: custom:mushroom-entity-card
                        entity: switch.camere_sonoff_100285a1db_1
                        name: Matrimoniale
                        icon: mdi:bed-king
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.matrimoniale_matrimoniale_studio_interruttore_1
                        name: Matrimoniale 2
                        icon: mdi:bed
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.camere_sonoff_100285a1db_2
                        name: Armadio
                        icon: mdi:wardrobe
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.rodolfo_sonoff_1002732647_1
                        name: Rodolfo
                        icon: mdi:lightbulb
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: custom:mushroom-entity-card
                        entity: switch.matrimoniale_matrimoniale_studio_interruttore_2
                        name: Studio
                        icon: mdi:desk
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass

                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-title-card
                        title: Giardino
                        card_mod:
                          style: |
                            ha-card .primary { color: white; }

                      - type: custom:mushroom-entity-card
                        entity: switch.esterno_rilevamento_del_movimento_della_telecamera
                        name: Blink Esterno
                        icon: mdi:cctv
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: horizontal-stack
                        cards:
                          - type: custom:mushroom-template-card
                            primary: "{{ states('sensor.blink_esterno_temperatura') }}°C"
                            icon: mdi:thermometer
                            layout: horizontal
                            tap_action:
                              action: more-info
                              entity: sensor.blink_esterno_temperatura
                            card_mod: *glass
                          - type: custom:mushroom-template-card
                            primary: "{{ states('sensor.blink_esterno_potenza_del_segnale_wi_fi') }}%"
                            icon: mdi:wifi
                            layout: horizontal
                            tap_action:
                              action: more-info
                              entity: sensor.blink_esterno_potenza_del_segnale_wi_fi
                            card_mod: *glass

                      - type: custom:mushroom-entity-card
                        entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
                        name: Blink Finestrone
                        icon: mdi:cctv
                        tap_action: { action: toggle }
                        layout: horizontal
                        card_mod: *glass
                      - type: horizontal-stack
                        cards:
                          - type: custom:mushroom-template-card
                            primary: "{{ states('sensor.blink_finestrone_temperatura') }}°C"
                            icon: mdi:thermometer
                            layout: horizontal
                            tap_action:
                              action: more-info
                              entity: sensor.blink_finestrone_temperatura
                            card_mod: *glass
                          - type: custom:mushroom-template-card
                            primary: "{{ states('sensor.blink_finestrone_potenza_del_segnale_wi_fi') }}%"
                            icon: mdi:wifi
                            layout: horizontal
                            tap_action:
                              action: more-info
                              entity: sensor.blink_finestrone_potenza_del_segnale_wi_fi
                            card_mod: *glass

                      - type: markdown
                        content: >
                          **Sistema**: aggiungi l'integrazione *System Monitor* per vedere qui
                          CPU/RAM/temperatura del Raspberry Pi.
                        card_mod:
                          style: |
                            ha-card {
                              background: rgba(255,255,255,0.06);
                              border: 1px solid rgba(255,255,255,0.12);
                              border-radius: 16px;
                              color: rgba(255,255,255,.8);
                              font-size: 11px;
                              padding: 8px;
                            }

              # Calendario di famiglia (richiede l'integrazione "Local Calendar",
              # vedi README per l'installazione) — conta come 1 sola card nello
              # stack esterno, quindi occupa quanto le 3 colonne messe insieme.
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Calendario Famiglia
                    card_mod:
                      style: |
                        ha-card .primary { color: white; }

                  - type: calendar
                    entities:
                      - calendar.famiglia
                    initial_view: dayGridMonth
                    card_mod: *glass

  - title: Casa
    path: casa
    icon: mdi:home
    type: panel
    cards:
      - type: picture-elements
        image: "data:image/svg+xml;base64,"
        elements:
          - type: state-icon
            entity: weather.forecast_casa
            icon: mdi:weather-partly-cloudy
            tap_action:
              action: more-info
            style:
              top: 2.1%
              left: 6.7%
              "--mdc-icon-size": 30px

          - type: icon
            icon: mdi:cctv
            tap_action:
              action: call-service
              service: switch.toggle
              target:
                entity_id:
                  - switch.esterno_rilevamento_del_movimento_della_telecamera
                  - switch.finestrone_rilevamento_del_movimento_della_telecamera
            style:
              top: 2.1%
              left: 50%
              color: "#2E7D32"
              "--mdc-icon-size": 28px

          - type: icon
            icon: mdi:power
            tap_action:
              action: call-service
              service: switch.turn_off
              target:
                entity_id:
                  - switch.salotto_sonoff_10027311cf_1
                  - switch.wifi_smart_switch_switch_1
                  - switch.cucina_sonoff_100272ffd8_1
                  - switch.sala_sonoff_100285929a_1
                  - switch.sala_sonoff_100285929a_2
                  - switch.wifi_smart_switch_switch_2
                  - switch.camere_sonoff_100285a1db_1
                  - switch.camere_sonoff_100285a1db_2
                  - switch.rodolfo_sonoff_1002732647_1
                  - switch.matrimoniale_matrimoniale_studio_interruttore_1
                  - switch.matrimoniale_matrimoniale_studio_interruttore_2
            style:
              top: 2.1%
              left: 93.3%
              color: "#D32F2F"
              "--mdc-icon-size": 28px

          # Primo Piano - Matrimoniale
          - type: state-icon
            entity: switch.camere_sonoff_100285a1db_1
            tap_action:
              action: toggle
            style:
              top: 19.3%
              left: 13.9%

          - type: state-icon
            entity: switch.matrimoniale_matrimoniale_studio_interruttore_1
            tap_action:
              action: toggle
            style:
              top: 19.3%
              left: 22.8%

          - type: state-icon
            entity: switch.camere_sonoff_100285a1db_2
            tap_action:
              action: toggle
            style:
              top: 12.9%
              left: 33.3%
              "--mdc-icon-size": 20px

          # Primo Piano - Rodolfo
          - type: state-icon
            entity: switch.rodolfo_sonoff_1002732647_1
            tap_action:
              action: toggle
            style:
              top: 19.3%
              left: 53.3%

          # Primo Piano - Studio
          - type: state-icon
            entity: switch.matrimoniale_matrimoniale_studio_interruttore_2
            tap_action:
              action: toggle
            style:
              top: 35.3%
              left: 43.9%

          # Piano Terra - Soggiorno / Salotto
          - type: state-icon
            entity: switch.salotto_sonoff_10027311cf_1
            tap_action:
              action: toggle
            style:
              top: 60%
              left: 15.1%

          - type: state-icon
            entity: switch.wifi_smart_switch_switch_1
            tap_action:
              action: toggle
            style:
              top: 67.1%
              left: 15.1%
              "--mdc-icon-size": 20px

          # Piano Terra - Pranzo
          - type: state-icon
            entity: switch.sala_sonoff_100285929a_2
            tap_action:
              action: toggle
            style:
              top: 58.6%
              left: 36.7%

          - type: state-icon
            entity: switch.wifi_smart_switch_switch_2
            tap_action:
              action: toggle
            style:
              top: 64.3%
              left: 36.7%

          - type: state-icon
            entity: switch.sala_sonoff_100285929a_1
            tap_action:
              action: toggle
            style:
              top: 70%
              left: 36.7%
              "--mdc-icon-size": 20px

          # Piano Terra - Cucina
          - type: state-icon
            entity: switch.cucina_sonoff_100272ffd8_1
            tap_action:
              action: toggle
            style:
              top: 62.9%
              left: 58.1%

          # Giardino - Blink Esterno
          - type: state-icon
            entity: switch.esterno_rilevamento_del_movimento_della_telecamera
            tap_action:
              action: toggle
            style:
              top: 89.3%
              left: 7.8%

          - type: state-label
            entity: sensor.blink_esterno_temperatura
            suffix: "°C"
            style:
              top: 92.9%
              left: 7.8%
              color: "#3A6EA5"
              font-weight: bold

          # Giardino - Blink Finestrone
          - type: state-icon
            entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
            tap_action:
              action: toggle
            style:
              top: 89.3%
              left: 92.2%

          - type: state-label
            entity: sensor.blink_finestrone_temperatura
            suffix: "°C"
            style:
              top: 92.9%
              left: 92.2%
              color: "#3A6EA5"
              font-weight: bold

  - title: Lista
    path: lista
    icon: mdi:format-list-bulleted
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('weather.forecast_casa') }}"
                secondary: Meteo
                icon: mdi:weather-partly-cloudy
                icon_color: blue
                layout: horizontal
                tap_action:
                  action: more-info
                  entity: weather.forecast_casa
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; }

              - type: custom:mushroom-template-card
                primary: Spegni Tutto
                icon: mdi:power
                icon_color: red
                layout: horizontal
                tap_action:
                  action: call-service
                  service: switch.turn_off
                  target:
                    entity_id:
                      - switch.salotto_sonoff_10027311cf_1
                      - switch.wifi_smart_switch_switch_1
                      - switch.cucina_sonoff_100272ffd8_1
                      - switch.sala_sonoff_100285929a_1
                      - switch.sala_sonoff_100285929a_2
                      - switch.wifi_smart_switch_switch_2
                      - switch.camere_sonoff_100285a1db_1
                      - switch.camere_sonoff_100285a1db_2
                      - switch.rodolfo_sonoff_1002732647_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_2
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; }

          - type: horizontal-stack
            cards:
              # --------------------------------------------------------
              # COLONNA ESTERNO
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Esterno

                  - type: custom:mushroom-template-card
                    primary: Telecamere
                    secondary: rilevamento movimento
                    icon: mdi:cctv
                    icon_color: green
                    layout: horizontal
                    tap_action:
                      action: call-service
                      service: switch.toggle
                      target:
                        entity_id:
                          - switch.esterno_rilevamento_del_movimento_della_telecamera
                          - switch.finestrone_rilevamento_del_movimento_della_telecamera
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.esterno_rilevamento_del_movimento_della_telecamera
                    name: Blink Esterno
                    icon: mdi:cctv
                    icon_color: green
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.blink_esterno_temperatura') }}°C"
                    secondary: "Wi-Fi {{ states('sensor.blink_esterno_potenza_del_segnale_wi_fi') }}%"
                    icon: mdi:thermometer
                    icon_color: blue
                    layout: horizontal
                    tap_action:
                      action: more-info
                      entity: sensor.blink_esterno_temperatura
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
                    name: Blink Finestrone
                    icon: mdi:cctv
                    icon_color: green
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.blink_finestrone_temperatura') }}°C"
                    secondary: "Wi-Fi {{ states('sensor.blink_finestrone_potenza_del_segnale_wi_fi') }}%"
                    icon: mdi:thermometer
                    icon_color: blue
                    layout: horizontal
                    tap_action:
                      action: more-info
                      entity: sensor.blink_finestrone_temperatura
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

              # --------------------------------------------------------
              # COLONNA PIANO TERRA
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Piano Terra

                  - type: custom:mushroom-entity-card
                    entity: switch.cucina_sonoff_100272ffd8_1
                    name: Cucina
                    icon: mdi:silverware-fork-knife
                    icon_color: orange
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.salotto_sonoff_10027311cf_1
                    name: Salotto
                    icon: mdi:sofa
                    icon_color: amber
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.sala_sonoff_100285929a_2
                    name: Pranzo
                    icon: mdi:silverware
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.wifi_smart_switch_switch_2
                    name: Pranzo (2)
                    icon: mdi:silverware-variant
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.sala_sonoff_100285929a_1
                    name: Presa
                    icon: mdi:power-socket-eu
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.wifi_smart_switch_switch_1
                    name: Presa Salotto
                    icon: mdi:power-socket-eu
                    icon_color: amber
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
