title: Casa
views:
  # ============================================================
  # HOME — vista principale
  # ============================================================
  - title: Home
    path: home
    icon: mdi:home-variant
    type: panel
    background: linear-gradient(135deg, #21153f 0%, #3a246b 45%, #6040a0 100%)
    cards:
      - type: vertical-stack
        card_mod:
          style: |
            :host {
              display: block;
              min-height: 100vh;
              background: linear-gradient(135deg, #21153f 0%, #3a246b 45%, #6040a0 100%);
            }
        cards:

          # ---------- HEADER ----------
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ now().strftime('%H:%M') }}"
                secondary: "{{ now().strftime('%A %d %B') | title }}"
                icon: mdi:clock-outline
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255,255,255,.11);
                      backdrop-filter: blur(22px);
                      -webkit-backdrop-filter: blur(22px);
                      border: 1px solid rgba(255,255,255,.16);
                      border-top-color: rgba(255,255,255,.30);
                      border-radius: 20px;
                      box-shadow: 0 10px 28px -14px rgba(0,0,0,.55);
                      color: white;
                      --primary-text-color: white;
                      --secondary-text-color: rgba(255,255,255,.62);
                      --icon-color: rgba(255,255,255,.90);
                    }
                    ha-card .primary {
                      font-size: 25px !important;
                      font-weight: 750 !important;
                      letter-spacing: -.03em;
                    }
                    ha-card .secondary {
                      font-size: 10px !important;
                      text-transform: uppercase;
                      letter-spacing: .07em;
                    }

              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    primary: Spegni tutto
                    secondary: Casa
                    icon: mdi:power
                    icon_color: red
                    layout: horizontal
                    tap_action:
                      action: perform-action
                      perform_action: switch.turn_off
                      target:
                        entity_id:
                          - switch.salotto_sonoff_10027311cf_1
                          - switch.wifi_smart_switch_switch_1
                          - switch.cucina_sonoff_100272ffd8_1
                          - switch.sala_sonoff_100285929a_2
                          - switch.camere_sonoff_100285a1db_1
                          - switch.rodolfo_sonoff_1002732647_1
                          - switch.matrimoniale_matrimoniale_studio_interruttore_2
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(255,75,70,.20);
                          border: 1px solid rgba(255,130,125,.25);
                          border-radius: 20px;
                          color: white;
                          --primary-text-color: white;
                          --secondary-text-color: rgba(255,255,255,.55);
                        }

                  - type: custom:mushroom-template-card
                    primary: Telecamere
                    secondary: Movimento
                    icon: mdi:cctv
                    icon_color: blue
                    layout: horizontal
                    tap_action:
                      action: perform-action
                      perform_action: switch.toggle
                      target:
                        entity_id:
                          - switch.esterno_rilevamento_del_movimento_della_telecamera
                          - switch.finestrone_rilevamento_del_movimento_della_telecamera
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(80,165,255,.18);
                          border: 1px solid rgba(130,190,255,.25);
                          border-radius: 20px;
                          color: white;
                          --primary-text-color: white;
                          --secondary-text-color: rgba(255,255,255,.55);
                        }

          # ---------- STANZE ----------
          - type: custom:mushroom-title-card
            title: Luci
            subtitle: Controllo rapido per ambiente
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  box-shadow: none;
                  padding: 4px 4px 0;
                  color: white;
                }
                ha-card .primary {
                  color: white !important;
                  font-size: 16px !important;
                  font-weight: 700 !important;
                }
                ha-card .secondary {
                  color: rgba(255,255,255,.52) !important;
                  font-size: 10px !important;
                }

          - type: grid
            columns: 3
            square: false
            cards:

              # Piano Terra
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Piano Terra
                    card_mod:
                      style: |
                        ha-card { background: transparent; box-shadow: none; }
                        ha-card .primary {
                          color: rgba(255,255,255,.62) !important;
                          font-size: 11px !important;
                          font-weight: 700 !important;
                          text-transform: uppercase;
                          letter-spacing: .07em;
                        }
                  - type: custom:mushroom-entity-card
                    entity: switch.salotto_sonoff_10027311cf_1
                    name: Salotto
                    icon: mdi:sofa
                    tap_action: { action: toggle }
                    layout: horizontal
                    card_mod: &glass
                      style: |
                        ha-card {
                          background: rgba(255,255,255,.09);
                          backdrop-filter: blur(20px);
                          -webkit-backdrop-filter: blur(20px);
                          border: 1px solid rgba(255,255,255,.14);
                          border-top-color: rgba(255,255,255,.25);
                          border-radius: 14px;
                          box-shadow: 0 7px 20px -12px rgba(0,0,0,.55);
                          color: white;
                          --primary-text-color: white;
                          --secondary-text-color: rgba(255,255,255,.52);
                          --icon-color: rgba(255,255,255,.85);
                          --spacing: 8px;
                          --icon-size: 32px;
                        }
                        ha-card mushroom-state-item, ha-card .container {
                          min-height: unset !important;
                        }
                  - type: custom:mushroom-entity-card
                    entity: switch.wifi_smart_switch_switch_1
                    name: Presa Salotto
                    icon: mdi:power-socket-eu
                    tap_action: { action: toggle }
                    layout: horizontal
                    card_mod: *glass
                  - type: custom:mushroom-entity-card
                    entity: switch.sala_sonoff_100285929a_2
                    name: Pranzo
                    icon: mdi:silverware
                    tap_action: { action: toggle }
                    layout: horizontal
                    card_mod: *glass
                  - type: custom:mushroom-entity-card
                    entity: switch.cucina_sonoff_100272ffd8_1
                    name: Cucina
                    icon: mdi:silverware-fork-knife
                    tap_action: { action: toggle }
                    layout: horizontal
                    card_mod: *glass

              # Primo Piano
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Primo Piano
                    card_mod:
                      style: |
                        ha-card { background: transparent; box-shadow: none; }
                        ha-card .primary {
                          color: rgba(255,255,255,.62) !important;
                          font-size: 11px !important;
                          font-weight: 700 !important;
                          text-transform: uppercase;
                          letter-spacing: .07em;
                        }
                  - type: custom:mushroom-entity-card
                    entity: switch.camere_sonoff_100285a1db_1
                    name: Matrimoniale
                    icon: mdi:bed-king
                    tap_action: { action: toggle }
                    layout: horizontal
                    card_mod: *glass
                  - type: custom:mushroom-entity-card
                    entity: switch.rodolfo_sonoff_1002732647_1
                    name: Rodolfo
                    icon: mdi:lightbulb
                    tap_action: { action: toggle }
                    layout: horizontal
                    card_mod: *glass
                  - type: custom:mushroom-entity-card
                    entity: switch.matrimoniale_matrimoniale_studio_interruttore_2
                    name: Studio
                    icon: mdi:desk
                    tap_action: { action: toggle }
                    layout: horizontal
                    card_mod: *glass

              # Esterno
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Esterno
                    card_mod:
                      style: |
                        ha-card { background: transparent; box-shadow: none; }
                        ha-card .primary {
                          color: rgba(255,255,255,.62) !important;
                          font-size: 11px !important;
                          font-weight: 700 !important;
                          text-transform: uppercase;
                          letter-spacing: .07em;
                        }
                  - type: custom:mushroom-entity-card
                    entity: switch.esterno_rilevamento_del_movimento_della_telecamera
                    name: Blink Esterno
                    icon: mdi:cctv
                    tap_action: { action: toggle }
                    layout: horizontal
                    card_mod: *glass
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: custom:mushroom-template-card
                        primary: "{{ states('sensor.blink_esterno_temperatura') }}°C"
                        secondary: Temperatura
                        icon: mdi:thermometer
                        tap_action:
                          action: more-info
                          entity: sensor.blink_esterno_temperatura
                        card_mod: *glass
                      - type: custom:mushroom-template-card
                        primary: "{{ states('sensor.blink_esterno_potenza_del_segnale_wi_fi') }}%"
                        secondary: Wi-Fi
                        icon: mdi:wifi
                        tap_action:
                          action: more-info
                          entity: sensor.blink_esterno_potenza_del_segnale_wi_fi
                        card_mod: *glass
                  - type: custom:mushroom-entity-card
                    entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
                    name: Blink Finestrone
                    icon: mdi:cctv
                    tap_action: { action: toggle }
                    layout: horizontal
                    card_mod: *glass
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: custom:mushroom-template-card
                        primary: "{{ states('sensor.blink_finestrone_temperatura') }}°C"
                        secondary: Temperatura
                        icon: mdi:thermometer
                        tap_action:
                          action: more-info
                          entity: sensor.blink_finestrone_temperatura
                        card_mod: *glass
                      - type: custom:mushroom-template-card
                        primary: "{{ states('sensor.blink_finestrone_potenza_del_segnale_wi_fi') }}%"
                        secondary: Wi-Fi
                        icon: mdi:wifi
                        tap_action:
                          action: more-info
                          entity: sensor.blink_finestrone_potenza_del_segnale_wi_fi
                        card_mod: *glass

          # ---------- METEO + CALENDARIO ----------
          - type: grid
            columns: 2
            square: false
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Meteo
                    subtitle: Oggi e prossimi giorni
                    card_mod:
                      style: |
                        ha-card { background: transparent; box-shadow: none; }
                        ha-card .primary {
                          color: rgba(255,255,255,.70) !important;
                          font-size: 12px !important;
                          font-weight: 700 !important;
                          text-transform: uppercase;
                          letter-spacing: .06em;
                        }
                  - type: weather-forecast
                    entity: weather.forecast_casa
                    show_forecast: true
                    forecast_type: daily
                    card_mod: *glass

              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Calendario
                    subtitle: Famiglia
                    card_mod:
                      style: |
                        ha-card { background: transparent; box-shadow: none; }
                        ha-card .primary {
                          color: rgba(255,255,255,.70) !important;
                          font-size: 12px !important;
                          font-weight: 700 !important;
                          text-transform: uppercase;
                          letter-spacing: .06em;
                        }
                  - type: calendar
                    entities:
                      - calendar.famiglia
                    initial_view: dayGridMonth
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(255,255,255,.09);
                          backdrop-filter: blur(20px);
                          -webkit-backdrop-filter: blur(20px);
                          border: 1px solid rgba(255,255,255,.14);
                          border-top-color: rgba(255,255,255,.25);
                          border-radius: 16px;
                          box-shadow: 0 7px 20px -12px rgba(0,0,0,.55);
                          color: white;
                          max-height: 260px;
                          overflow-y: auto;
                        }

  # ============================================================
  # LISTA — vista secondaria, più compatta e operativa
  # ============================================================
  - title: Lista
    path: lista
    icon: mdi:format-list-bulleted
    type: panel
    background: linear-gradient(135deg, #21153f 0%, #3a246b 45%, #6040a0 100%)
    cards:
      - type: vertical-stack
        card_mod:
          style: |
            :host {
              display: block;
              min-height: 100vh;
              background: linear-gradient(135deg, #21153f 0%, #3a246b 45%, #6040a0 100%);
            }
        cards:
          - type: custom:mushroom-title-card
            title: Controllo Casa
            subtitle: Tutti i dispositivi in una vista compatta
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  box-shadow: none;
                  color: white;
                }
                ha-card .primary {
                  color: white !important;
                  font-size: 22px !important;
                  font-weight: 750 !important;
                }
                ha-card .secondary {
                  color: rgba(255,255,255,.52) !important;
                }

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('weather.forecast_casa') | replace('_',' ') | title }}"
                secondary: Meteo
                icon: mdi:weather-partly-cloudy
                icon_color: blue
                layout: horizontal
                tap_action:
                  action: more-info
                  entity: weather.forecast_casa
                card_mod: *glass

              - type: custom:mushroom-template-card
                primary: Spegni tutto
                secondary: Tutte le luci
                icon: mdi:power
                icon_color: red
                layout: horizontal
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_off
                  target:
                    entity_id:
                      - switch.salotto_sonoff_10027311cf_1
                      - switch.wifi_smart_switch_switch_1
                      - switch.cucina_sonoff_100272ffd8_1
                      - switch.sala_sonoff_100285929a_2
                      - switch.camere_sonoff_100285a1db_1
                      - switch.rodolfo_sonoff_1002732647_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_2
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255,75,70,.20);
                      border: 1px solid rgba(255,130,125,.25);
                      border-radius: 18px;
                      color: white;
                    }

          - type: custom:mushroom-title-card
            title: Esterno
            card_mod:
              style: |
                ha-card { background: transparent; box-shadow: none; }
                ha-card .primary {
                  color: rgba(255,255,255,.65) !important;
                  font-size: 12px !important;
                  text-transform: uppercase;
                  letter-spacing: .06em;
                }

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.esterno_rilevamento_del_movimento_della_telecamera
                name: Blink Esterno
                icon: mdi:cctv
                tap_action: { action: toggle }
                layout: horizontal
                card_mod: *glass
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.blink_esterno_temperatura') }}°C"
                secondary: "Wi-Fi {{ states('sensor.blink_esterno_potenza_del_segnale_wi_fi') }}%"
                icon: mdi:thermometer
                layout: horizontal
                card_mod: *glass
              - type: custom:mushroom-entity-card
                entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
                name: Blink Finestrone
                icon: mdi:cctv
                tap_action: { action: toggle }
                layout: horizontal
                card_mod: *glass
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.blink_finestrone_temperatura') }}°C"
                secondary: "Wi-Fi {{ states('sensor.blink_finestrone_potenza_del_segnale_wi_fi') }}%"
                icon: mdi:thermometer
                layout: horizontal
                card_mod: *glass

          - type: custom:mushroom-title-card
            title: Piano Terra
            card_mod:
              style: |
                ha-card { background: transparent; box-shadow: none; }
                ha-card .primary {
                  color: rgba(255,255,255,.65) !important;
                  font-size: 12px !important;
                  text-transform: uppercase;
                  letter-spacing: .06em;
                }

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.salotto_sonoff_10027311cf_1
                name: Salotto
                icon: mdi:sofa
                tap_action: { action: toggle }
                layout: horizontal
                card_mod: *glass
              - type: custom:mushroom-entity-card
                entity: switch.wifi_smart_switch_switch_1
                name: Presa Salotto
                icon: mdi:power-socket-eu
                tap_action: { action: toggle }
                layout: horizontal
                card_mod: *glass
              - type: custom:mushroom-entity-card
                entity: switch.sala_sonoff_100285929a_2
                name: Pranzo
                icon: mdi:silverware
                tap_action: { action: toggle }
                layout: horizontal
                card_mod: *glass
              - type: custom:mushroom-entity-card
                entity: switch.cucina_sonoff_100272ffd8_1
                name: Cucina
                icon: mdi:silverware-fork-knife
                tap_action: { action: toggle }
                layout: horizontal
                card_mod: *glass

          - type: custom:mushroom-title-card
            title: Primo Piano
            card_mod:
              style: |
                ha-card { background: transparent; box-shadow: none; }
                ha-card .primary {
                  color: rgba(255,255,255,.65) !important;
                  font-size: 12px !important;
                  text-transform: uppercase;
                  letter-spacing: .06em;
                }

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.camere_sonoff_100285a1db_1
                name: Matrimoniale
                icon: mdi:bed-king
                tap_action: { action: toggle }
                layout: horizontal
                card_mod: *glass
              - type: custom:mushroom-entity-card
                entity: switch.rodolfo_sonoff_1002732647_1
                name: Rodolfo
                icon: mdi:lightbulb
                tap_action: { action: toggle }
                layout: horizontal
                card_mod: *glass
              - type: custom:mushroom-entity-card
                entity: switch.matrimoniale_matrimoniale_studio_interruttore_2
                name: Studio
                icon: mdi:desk
                tap_action: { action: toggle }
                layout: horizontal
                card_mod: *glass
