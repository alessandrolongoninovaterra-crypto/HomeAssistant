title: Casa
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Casa
            heading_style: title
            icon: mdi:home-heart

          - type: custom:mushroom-template-card
            primary: "{{ states('weather.forecast_casa') }}"
            secondary: Meteo
            icon: mdi:weather-partly-cloudy
            icon_color: blue
            layout: horizontal
            fill_container: true
            tap_action:
              action: more-info
              entity: weather.forecast_casa
            card_mod:
              style: |
                ha-card { border-radius: 24px; --icon-size: 48px; }

      - type: grid
        columns: 3
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.salotto_sonoff_10027311cf_1
            name: Salotto
            icon: mdi:sofa
            icon_color: amber
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.wifi_smart_switch_switch_1
            name: Presa Salotto
            icon: mdi:power-socket-eu
            icon_color: amber
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.cucina_sonoff_100272ffd8_1
            name: Cucina
            icon: mdi:silverware-fork-knife
            icon_color: orange
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.sala_sonoff_100285929a_1
            name: Sala - Presa
            icon: mdi:power-socket-eu
            icon_color: teal
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.sala_sonoff_100285929a_2
            name: Sala - Pranzo
            icon: mdi:silverware
            icon_color: teal
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.wifi_smart_switch_switch_2
            name: Sala Pranzo
            icon: mdi:silverware-variant
            icon_color: teal
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.camere_sonoff_100285a1db_1
            name: Matrimoniale
            icon: mdi:bed-king
            icon_color: indigo
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.camere_sonoff_100285a1db_2
            name: Armadio
            icon: mdi:wardrobe
            icon_color: indigo
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.rodolfo_sonoff_1002732647_1
            name: Roddi
            icon: mdi:lightbulb
            icon_color: purple
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.matrimoniale_matrimoniale_studio_interruttore_1
            name: Matrimoniale (2)
            icon: mdi:bed
            icon_color: indigo
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.matrimoniale_matrimoniale_studio_interruttore_2
            name: Studio
            icon: mdi:desk
            icon_color: cyan
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

      - type: grid
        columns: 1
        cards:
          - type: custom:mushroom-template-card
            primary: Spegni Tutto
            icon: mdi:power
            icon_color: red
            layout: horizontal
            fill_container: true
            tap_action:
              action: call-service
              service: switch.turn_off
              target:
                entity_id:
                  - switch.salotto_sonoff_10027311cf_1
                  - switch.wifi_smart_switch_switch_1
                  - switch.cucina_sonoff_100272ffd8_1
                  - switch.sala_sonoff_100285929a_1
                  - switch.sala_sonoff_100285929a_2
                  - switch.wifi_smart_switch_switch_2
                  - switch.camere_sonoff_100285a1db_1
                  - switch.camere_sonoff_100285a1db_2
                  - switch.rodolfo_sonoff_1002732647_1
                  - switch.matrimoniale_matrimoniale_studio_interruttore_1
                  - switch.matrimoniale_matrimoniale_studio_interruttore_2
            card_mod:
              style: |
                ha-card { border-radius: 20px; }

  - title: Giardino
    path: giardino
    icon: mdi:flower
    type: sections
    sections:
      - type: grid
        columns: 2
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.blink_esterno_temperatura') }}°C"
            secondary: Esterno
            icon: mdi:thermometer
            icon_color: blue
            layout: vertical
            fill_container: true
            tap_action:
              action: more-info
              entity: sensor.blink_esterno_temperatura
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.blink_finestrone_temperatura') }}°C"
            secondary: Finestrone
            icon: mdi:thermometer
            icon_color: blue
            layout: vertical
            fill_container: true
            tap_action:
              action: more-info
              entity: sensor.blink_finestrone_temperatura
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.esterno_rilevamento_del_movimento_della_telecamera
            name: Rilevamento Esterno
            icon: mdi:cctv
            icon_color: green
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

          - type: custom:mushroom-entity-card
            entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
            name: Rilevamento Finestrone
            icon: mdi:cctv
            icon_color: green
            tap_action:
              action: toggle
            layout: vertical
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 24px; }

  - title: Sistema
    path: sistema
    icon: mdi:cog
    type: sections
    sections:
      - type: grid
        columns: 1
        cards:
          - type: custom:mushroom-title-card
            title: Aggiornamenti

          - type: entities
            title: ""
            show_header_toggle: false
            entities:
              - entity: update.home_assistant_core_update
                name: Home Assistant Core
              - entity: update.home_assistant_operating_system_update
                name: Home Assistant OS
              - entity: update.home_assistant_supervisor_update
                name: Supervisor
              - entity: update.hacs_update
                name: HACS
              - entity: update.mushroom_update
                name: Mushroom
              - entity: update.sonoff_lan_update
                name: Sonoff LAN
              - entity: update.matter_server_update
                name: Matter Server
              - entity: update.matrimoniale_matrimoniale_studio_firmware
                name: Firmware Matrimoniale-Studio
              - entity: update.wifi_smart_switch_firmware
                name: Firmware WiFi Smart Switch
            card_mod:
              style: |
                ha-card { border-radius: 20px; }

          - type: custom:mushroom-title-card
            title: Varie

          - type: custom:mushroom-entity-card
            entity: todo.shopping_list
            name: Lista della Spesa
            icon: mdi:cart
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { border-radius: 20px; }

          - type: custom:mushroom-entity-card
            entity: sun.sun
            name: Sole
            icon: mdi:weather-sunny
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { border-radius: 20px; }
