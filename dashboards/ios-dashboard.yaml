title: Casa
views:
  - title: Casa
    path: casa
    icon: mdi:home
    type: panel
    cards:
      - type: picture-elements
        image: /local/house.svg
        elements:
          - type: state-icon
            entity: weather.forecast_casa
            icon: mdi:weather-partly-cloudy
            tap_action:
              action: more-info
            style:
              top: 3.8%
              left: 3.75%
              "--mdc-icon-size": 30px

          - type: icon
            icon: mdi:cctv
            tap_action:
              action: call-service
              service: switch.toggle
              target:
                entity_id:
                  - switch.esterno_rilevamento_del_movimento_della_telecamera
                  - switch.finestrone_rilevamento_del_movimento_della_telecamera
            style:
              top: 3.8%
              left: 50%
              color: "#2E7D32"
              "--mdc-icon-size": 28px

          - type: icon
            icon: mdi:power
            tap_action:
              action: call-service
              service: switch.turn_off
              target:
                entity_id:
                  - switch.salotto_sonoff_10027311cf_1
                  - switch.wifi_smart_switch_switch_1
                  - switch.cucina_sonoff_100272ffd8_1
                  - switch.sala_sonoff_100285929a_1
                  - switch.sala_sonoff_100285929a_2
                  - switch.wifi_smart_switch_switch_2
                  - switch.camere_sonoff_100285a1db_1
                  - switch.camere_sonoff_100285a1db_2
                  - switch.rodolfo_sonoff_1002732647_1
                  - switch.matrimoniale_matrimoniale_studio_interruttore_1
                  - switch.matrimoniale_matrimoniale_studio_interruttore_2
            style:
              top: 3.8%
              left: 96.25%
              color: "#D32F2F"
              "--mdc-icon-size": 28px

          # Primo Piano - Matrimoniale
          - type: state-icon
            entity: switch.camere_sonoff_100285a1db_1
            tap_action:
              action: toggle
            style:
              top: 28.8%
              left: 17.5%

          - type: state-icon
            entity: switch.matrimoniale_matrimoniale_studio_interruttore_1
            tap_action:
              action: toggle
            style:
              top: 28.8%
              left: 27.5%

          - type: state-icon
            entity: switch.camere_sonoff_100285a1db_2
            tap_action:
              action: toggle
            style:
              top: 21.2%
              left: 35%
              "--mdc-icon-size": 20px

          # Primo Piano - Rodolfo
          - type: state-icon
            entity: switch.rodolfo_sonoff_1002732647_1
            tap_action:
              action: toggle
            style:
              top: 28.8%
              left: 76.25%

          # Primo Piano - Studio
          - type: state-icon
            entity: switch.matrimoniale_matrimoniale_studio_interruttore_2
            tap_action:
              action: toggle
            style:
              top: 38.6%
              left: 53.75%

          # Piano Terra - Soggiorno / Salotto
          - type: state-icon
            entity: switch.salotto_sonoff_10027311cf_1
            tap_action:
              action: toggle
            style:
              top: 66.7%
              left: 18.75%

          - type: state-icon
            entity: switch.wifi_smart_switch_switch_1
            tap_action:
              action: toggle
            style:
              top: 74.2%
              left: 18.75%
              "--mdc-icon-size": 20px

          # Piano Terra - Pranzo
          - type: state-icon
            entity: switch.sala_sonoff_100285929a_2
            tap_action:
              action: toggle
            style:
              top: 65.2%
              left: 40%

          - type: state-icon
            entity: switch.wifi_smart_switch_switch_2
            tap_action:
              action: toggle
            style:
              top: 71.2%
              left: 40%

          - type: state-icon
            entity: switch.sala_sonoff_100285929a_1
            tap_action:
              action: toggle
            style:
              top: 77.3%
              left: 40%
              "--mdc-icon-size": 20px

          # Piano Terra - Cucina
          - type: state-icon
            entity: switch.cucina_sonoff_100272ffd8_1
            tap_action:
              action: toggle
            style:
              top: 69.7%
              left: 58.75%

          # Giardino - Blink Esterno
          - type: state-icon
            entity: switch.esterno_rilevamento_del_movimento_della_telecamera
            tap_action:
              action: toggle
            style:
              top: 93.2%
              left: 7.5%

          - type: state-label
            entity: sensor.blink_esterno_temperatura
            suffix: "°C"
            style:
              top: 96.7%
              left: 7.5%
              color: "#3A6EA5"
              font-weight: bold

          # Giardino - Blink Finestrone
          - type: state-icon
            entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
            tap_action:
              action: toggle
            style:
              top: 93.2%
              left: 92.5%

          - type: state-label
            entity: sensor.blink_finestrone_temperatura
            suffix: "°C"
            style:
              top: 96.7%
              left: 92.5%
              color: "#3A6EA5"
              font-weight: bold

  - title: Lista
    path: lista
    icon: mdi:format-list-bulleted
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('weather.forecast_casa') }}"
                secondary: Meteo
                icon: mdi:weather-partly-cloudy
                icon_color: blue
                layout: horizontal
                tap_action:
                  action: more-info
                  entity: weather.forecast_casa
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; }

              - type: custom:mushroom-template-card
                primary: Spegni Tutto
                icon: mdi:power
                icon_color: red
                layout: horizontal
                tap_action:
                  action: call-service
                  service: switch.turn_off
                  target:
                    entity_id:
                      - switch.salotto_sonoff_10027311cf_1
                      - switch.wifi_smart_switch_switch_1
                      - switch.cucina_sonoff_100272ffd8_1
                      - switch.sala_sonoff_100285929a_1
                      - switch.sala_sonoff_100285929a_2
                      - switch.wifi_smart_switch_switch_2
                      - switch.camere_sonoff_100285a1db_1
                      - switch.camere_sonoff_100285a1db_2
                      - switch.rodolfo_sonoff_1002732647_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_1
                      - switch.matrimoniale_matrimoniale_studio_interruttore_2
                card_mod:
                  style: |
                    ha-card { border-radius: 16px; }

          - type: horizontal-stack
            cards:
              # --------------------------------------------------------
              # COLONNA ESTERNO
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Esterno

                  - type: custom:mushroom-template-card
                    primary: Telecamere
                    secondary: rilevamento movimento
                    icon: mdi:cctv
                    icon_color: green
                    layout: horizontal
                    tap_action:
                      action: call-service
                      service: switch.toggle
                      target:
                        entity_id:
                          - switch.esterno_rilevamento_del_movimento_della_telecamera
                          - switch.finestrone_rilevamento_del_movimento_della_telecamera
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.esterno_rilevamento_del_movimento_della_telecamera
                    name: Blink Esterno
                    icon: mdi:cctv
                    icon_color: green
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.blink_esterno_temperatura') }}°C"
                    secondary: "Wi-Fi {{ states('sensor.blink_esterno_potenza_del_segnale_wi_fi') }}%"
                    icon: mdi:thermometer
                    icon_color: blue
                    layout: horizontal
                    tap_action:
                      action: more-info
                      entity: sensor.blink_esterno_temperatura
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.finestrone_rilevamento_del_movimento_della_telecamera
                    name: Blink Finestrone
                    icon: mdi:cctv
                    icon_color: green
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.blink_finestrone_temperatura') }}°C"
                    secondary: "Wi-Fi {{ states('sensor.blink_finestrone_potenza_del_segnale_wi_fi') }}%"
                    icon: mdi:thermometer
                    icon_color: blue
                    layout: horizontal
                    tap_action:
                      action: more-info
                      entity: sensor.blink_finestrone_temperatura
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

              # --------------------------------------------------------
              # COLONNA PIANO TERRA
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Piano Terra

                  - type: custom:mushroom-entity-card
                    entity: switch.cucina_sonoff_100272ffd8_1
                    name: Cucina
                    icon: mdi:silverware-fork-knife
                    icon_color: orange
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.salotto_sonoff_10027311cf_1
                    name: Salotto
                    icon: mdi:sofa
                    icon_color: amber
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.sala_sonoff_100285929a_2
                    name: Pranzo
                    icon: mdi:silverware
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.wifi_smart_switch_switch_2
                    name: Pranzo (2)
                    icon: mdi:silverware-variant
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.sala_sonoff_100285929a_1
                    name: Presa
                    icon: mdi:power-socket-eu
                    icon_color: teal
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.wifi_smart_switch_switch_1
                    name: Presa Salotto
                    icon: mdi:power-socket-eu
                    icon_color: amber
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

              # --------------------------------------------------------
              # COLONNA PRIMO PIANO
              # --------------------------------------------------------
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Primo Piano

                  - type: custom:mushroom-entity-card
                    entity: switch.camere_sonoff_100285a1db_1
                    name: Matrimoniale
                    icon: mdi:bed-king
                    icon_color: indigo
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.matrimoniale_matrimoniale_studio_interruttore_1
                    name: Matrimoniale (2)
                    icon: mdi:bed
                    icon_color: indigo
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.camere_sonoff_100285a1db_2
                    name: Armadio
                    icon: mdi:wardrobe
                    icon_color: indigo
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.rodolfo_sonoff_1002732647_1
                    name: Rodolfo
                    icon: mdi:lightbulb
                    icon_color: purple
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }

                  - type: custom:mushroom-entity-card
                    entity: switch.matrimoniale_matrimoniale_studio_interruttore_2
                    name: Studio
                    icon: mdi:desk
                    icon_color: cyan
                    tap_action:
                      action: toggle
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card { border-radius: 16px; }
